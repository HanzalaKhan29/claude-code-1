<!doctype html>
<!--
  Kinetic reel (full-frame, 1080x1920, 30 fps, 8 s). The motion-reels genre grammar measured on
  metromedia.house / earn.edits / earnera.co / lightyear.residency (references/motion-reels.md):
    - two-tier type: WHISPER tier (lowercase italic serif, ~4.5% of frame height) carries the sentence,
      APEX tier (Anton caps, ~16-19% cap height) punctuates one word per beat
    - words appear on the spoken word with a HARD pop (tl.set, 0 frames of transition), never fades
    - the ground colour rotates between beats (ink -> lime -> cream -> ink) so every cut is a visible change
      instead of a transition; ONE accent (lime) for the whole video
    - an annotation mark (hand-drawn ellipse) points at the content; no particles, no glow
    - film grain on every frame (seek-safe: the noise seed is a pure function of time)
    - soft-sell end card held ~3 s
  COPY IS EXAMPLE TEXT: replace every word with the user's own VO words and every time with words_cut.json
  times (the beat lands ON the spoken word). Keep the copy list and the BEATS times in sync.
  Contract: one paused GSAP timeline at window.__timelines["kinetic-reel"]; local @font-face; GSAP vendored;
  no CSS transform on GSAP-moved elements; data-layout-allow-occlusion on text that overlaps by design.
  Render: npx hyperframes render . -o kinetic-reel.mp4    (opaque reel; use --format mov only for overlays)
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton-400.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Instrument Serif"; src: url("fonts/InstrumentSerif-400Italic.ttf") format("truetype"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-700.ttf") format("truetype"); font-weight: 700; }
      /* BRAND: ink / cream grounds + exactly one accent. Change --accent per video, never add a second. */
      :root { --ink: #0E0F0E; --cream: #F1EEE6; --accent: #DDF53D; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
      .ground { position: absolute; inset: 0; background: var(--ink); }
      /* Centre stage inside the 9:16 safe box (x 120-960, y 288-1248): the lockup is centred at y ~ 760 */
      .stage { position: absolute; left: 120px; right: 120px; top: 288px; height: 960px;
               display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .beat { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column;
              align-items: center; justify-content: center; opacity: 0; }
      .whisper { font-family: "Instrument Serif", serif; font-style: italic; font-size: 88px; line-height: 1.05;
                 letter-spacing: -0.01em; color: var(--cream); white-space: nowrap; }
      .whisper .w { opacity: 0; }
      .apex { position: relative; font-family: "Anton", sans-serif; font-size: 330px; line-height: 1.0;
              letter-spacing: -0.005em; text-transform: uppercase; color: var(--accent); white-space: nowrap;
              margin-top: 18px; }
      .on-light .whisper, .on-light .apex { color: var(--ink); }
      .ring { position: absolute; left: -70px; top: -40px; width: calc(100% + 140px); height: calc(100% + 80px);
              overflow: visible; }
      .ring path { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
      .bar { width: 100%; height: 22px; background: var(--accent); margin-top: 6px; }
      .label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--accent); margin-top: 44px; opacity: 0; }
      /* grain: a tiled noise PNG (black/white specks, low alpha) shifted 12x a second; reads on dark AND light */
      .grain { position: absolute; inset: 0; background-image: url("grain.png"); background-repeat: repeat;
               background-size: 256px 256px; opacity: 0.9; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="kinetic-reel" data-start="0" data-duration="8" data-fps="30" data-width="1080" data-height="1920">
      <div id="ground" class="ground"></div>
      <div class="stage">
        <!-- COPY LIST (example). Beat 1: hook on ink -->
        <div id="b1" class="beat">
          <div class="whisper" data-layout-allow-occlusion><span class="w" data-layout-allow-occlusion id="b1w1">most</span> <span class="w" data-layout-allow-occlusion id="b1w2">edits</span> <span class="w" data-layout-allow-occlusion id="b1w3">feel</span></div>
          <div id="b1a" class="apex" data-layout-allow-occlusion>SLOW</div>
        </div>
        <!-- Beat 2: the turn on lime, annotation ellipse around the apex word -->
        <div id="b2" class="beat on-light">
          <div class="whisper" data-layout-allow-occlusion><span class="w" data-layout-allow-occlusion id="b2w1">cut</span> <span class="w" data-layout-allow-occlusion id="b2w2">on</span> <span class="w" data-layout-allow-occlusion id="b2w3">the</span></div>
          <div id="b2a" class="apex" data-layout-allow-occlusion>BEAT
            <svg class="ring" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <path id="ringpath" fill="none" stroke-width="1.7" pathLength="1000" d="M8,56 C6,26 38,9 62,12 C86,15 97,36 93,58 C89,82 58,93 34,89 C14,86 4,70 9,50 C11,42 16,35 22,31"/>
            </svg>
          </div>
        </div>
        <!-- Beat 3: contrast on cream, accent bar wipes under the apex word -->
        <div id="b3" class="beat on-light">
          <div class="whisper" data-layout-allow-occlusion><span class="w" data-layout-allow-occlusion id="b3w1">not</span> <span class="w" data-layout-allow-occlusion id="b3w2">on</span> <span class="w" data-layout-allow-occlusion id="b3w3">the</span></div>
          <div class="apex" data-layout-allow-occlusion><span id="b3a" data-layout-allow-occlusion>CLOCK</span><div id="b3bar" class="bar"></div></div>
        </div>
        <!-- Beat 4: soft-sell end card on ink, held ~3 s -->
        <div id="b4" class="beat">
          <div class="whisper" data-layout-allow-occlusion><span class="w" data-layout-allow-occlusion id="b4w1">save</span> <span class="w" data-layout-allow-occlusion id="b4w2">this</span> <span class="w" data-layout-allow-occlusion id="b4w3">for</span></div>
          <div id="b4a" class="apex" data-layout-allow-occlusion>LATER</div>
          <div id="b4l" class="label" data-layout-allow-occlusion>your next edit</div>
        </div>
      </div>
      <div id="grain" class="grain" aria-hidden="true" data-layout-allow-occlusion></div>
    </div>
    <script>
      // BEATS: replace with words_cut.json times. Each whisper word pops ON its spoken word; the apex word pops
      // on its word; the beat (ground + text) changes on the first word of the next beat.
      const BEATS = [
        { id: "b1", ground: "#0E0F0E", words: [0.10, 0.32, 0.52], apex: 0.80 },
        { id: "b2", ground: "#DDF53D", words: [1.90, 2.08, 2.22], apex: 2.42 },
        { id: "b3", ground: "#F1EEE6", words: [3.60, 3.84, 4.00], apex: 4.20 },
        { id: "b4", ground: "#0E0F0E", words: [5.00, 5.18, 5.34], apex: 5.56 },
      ];
      const DUR = 8, FPS = 30;
      const tl = gsap.timeline({ paused: true });

      BEATS.forEach((b, i) => {
        const start = b.words[0];
        // hard cut into the beat: ground colour and beat container switch on the same frame
        tl.set("#ground", { backgroundColor: b.ground }, start);
        tl.set("#" + b.id, { opacity: 1 }, start);
        if (i > 0) tl.set("#" + BEATS[i - 1].id, { opacity: 0 }, start);
        b.words.forEach((t, k) => tl.set("#" + b.id + "w" + (k + 1), { opacity: 1 }, t));
      });
      // apex words: HARD pop (visible on the word's first frame, no fade) + a 0.18 s settle from 112% (a slam)
      [["#b1a", 0], ["#b2a", 1], ["#b3a", 2], ["#b4a", 3]].forEach(([sel, i]) => {
        const t = BEATS[i].apex;
        tl.set(sel, { opacity: 0 }, 0);
        tl.set(sel, { opacity: 1 }, t);
        tl.fromTo(sel, { scale: 1.12 }, { scale: 1, duration: 0.18, ease: "expo.out", immediateRender: false }, t);
      });
      // annotation: the ellipse draws around BEAT (fast -> slow), 0.55 s, after the apex lands
      tl.fromTo("#ringpath", { strokeDashoffset: 1000, strokeDasharray: 1000 },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, BEATS[1].apex + 0.12);
      // accent bar wipes in under CLOCK from the left
      tl.fromTo("#b3bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "expo.out" },
        BEATS[2].apex + 0.1);
      // end-card label, then stillness: nothing moves for the last ~2.4 s (read-hold)
      tl.set("#b4l", { opacity: 1 }, BEATS[3].apex + 0.35);
      tl.set({}, {}, DUR);  // timeline spans the full duration

      // grain: the noise tile jumps to a new offset 12 times a second, as a pure function of time (seek-safe;
      // SVG feTurbulence is NOT used because headless renderers often skip it)
      const grainEl = document.getElementById("grain");
      let _s = -1;
      const grain = {};
      Object.defineProperty(grain, "s", { get() { return _s; },
        set(v) { const n = Math.floor(v); if (n !== _s) { _s = n;
          grainEl.style.backgroundPosition = ((n * 137) % 256) + "px " + ((n * 89) % 256) + "px"; } } });
      tl.fromTo(grain, { s: 0 }, { s: DUR * 12, duration: DUR, ease: "none" }, 0);
      window.__timelines["kinetic-reel"] = tl;
    </script>
  </body>
</html>
