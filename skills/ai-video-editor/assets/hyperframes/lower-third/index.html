<!doctype html>
<!--
  Lower-third overlay (transparent). Render:  npx hyperframes render . --format mov -o lower-third.mov
  Then place it with scripts/overlay.py at the spoken word. Edit only the CONTENT and BRAND blocks.
  Mask reveals clip text on purpose: every text node carries data-layout-allow-occlusion so `check` passes.
  Contract notes (HyperFrames core): one paused GSAP timeline registered under the root composition id;
  fonts via local @font-face; no CSS transform on elements GSAP moves (use fromTo); nothing random or clock-based.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("fonts/Inter-800.ttf") format("truetype"); font-weight: 800; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-500.ttf") format("truetype"); font-weight: 500; }
      /* BRAND: one accent, tinted neutrals */
      :root { --ink: #F5F3EE; --sub: rgba(245, 243, 238, 0.78); --accent: #FFD400; --plate: rgba(14, 15, 18, 0.72); }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }
      /* sits on the 5% title-safe edge, baseline around 82% of height */
      .lt { position: absolute; left: 96px; bottom: 150px; display: flex; align-items: stretch; gap: 22px; }
      .bar { width: 8px; background: var(--accent); border-radius: 2px; }
      .text { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 18px 28px 18px 0; }
      .plate { position: absolute; inset: 0; background: var(--plate); border-radius: 6px; }
      .mask { overflow: hidden; display: block; position: relative; }
      .name { display: block; color: var(--ink); font-weight: 800; font-size: 54px; letter-spacing: -0.015em; line-height: 1.05; }
      .role { display: block; color: var(--sub); font-weight: 500; font-size: 30px; letter-spacing: 0.01em; line-height: 1.2; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="lower-third" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="lt" class="lt">
        <div id="plate" class="plate"></div>
        <div id="bar" class="bar"></div>
        <div class="text">
          <!-- CONTENT: use the speaker's real name/role, never invented -->
          <span class="mask" data-layout-allow-overflow data-layout-allow-occlusion><span id="name" class="name" data-layout-allow-occlusion>Speaker Name</span></span>
          <span class="mask" data-layout-allow-overflow data-layout-allow-occlusion><span id="role" class="role" data-layout-allow-occlusion>Role, Company</span></span>
        </div>
      </div>
    </div>
    <script>
      // Timing: enter ~0.55s (decelerate), hold to read (words x 0.3s + 0.5s), exit ~0.4s (accelerate, ~80% of entry)
      const ENTER = "expo.out", EXIT = "power3.in";
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#plate", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: ENTER }, 0.05)
        .fromTo("#bar", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.35, ease: ENTER }, 0.0)
        .fromTo("#name", { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: ENTER }, 0.18)
        .fromTo("#role", { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: ENTER }, 0.26)
        // exit: reverse order, faster, same axis it came from; fully clear >= 0.2 s before the end (no pop at the cut)
        .to("#role", { yPercent: 110, duration: 0.32, ease: EXIT }, 4.25)
        .to("#name", { yPercent: 110, duration: 0.32, ease: EXIT }, 4.31)
        .to("#plate", { scaleX: 0, duration: 0.36, ease: EXIT }, 4.41)
        .to("#bar", { scaleY: 0, duration: 0.3, ease: EXIT }, 4.47);
      window.__timelines["lower-third"] = tl;
    </script>
  </body>
</html>
