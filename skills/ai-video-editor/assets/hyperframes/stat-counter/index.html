<!doctype html>
<!--
  Stat counter card (transparent overlay, 1920x1080, 30 fps, 5 s). Lint + check clean, render-tested.
  The numbers below are an EXAMPLE brief ("from 1,200 to 48,000 subscribers in 9 months"): replace START, END
  and the CONTENT block with the user's real figures. Never invent numbers.
  Render: npx hyperframes render . --format mov -o stat-counter.mov
  Place it so the count STARTS about T_COUNT seconds before the spoken number: at = word_time - T_COUNT.
  Mask reveals clip text on purpose, so every text node (and generated digit span) carries
  data-layout-allow-occlusion; otherwise `hyperframes check` reports text_occluded.
  Look: 20 Monochrome Keynote adapted for an overlay (no black stage; a dark plate carries legibility).
  Contract: one paused GSAP timeline under the root composition id; local @font-face; GSAP vendored (no CDN);
  no CSS transform on GSAP-moved elements; counter driven by a property setter so every frame is a pure
  function of time (seek-safe, no onUpdate callbacks).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "Manrope"; src: url("fonts/Manrope-800.ttf") format("truetype"); font-weight: 800; }
      @font-face { font-family: "Manrope"; src: url("fonts/Manrope-500.ttf") format("truetype"); font-weight: 500; }
      /* BRAND: tinted neutrals + exactly one accent (electric blue, Look 20) */
      :root {
        --ink: #FFFFFF;
        --sub: rgba(255, 255, 255, 0.72);
        --muted: rgba(255, 255, 255, 0.56);
        --accent: #2F80FF;
        --plate: rgba(10, 11, 14, 0.84);
        --edge: rgba(255, 255, 255, 0.08);
        --track: rgba(255, 255, 255, 0.14);
      }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Manrope", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Manrope", sans-serif; }
      /* Side zone: left third, inside 5% title-safe (96 px), vertically centred; keeps a centred face clear */
      .zone { position: absolute; left: 96px; top: 0; bottom: 0; display: flex; align-items: center; }
      .card { position: relative; width: 600px; box-sizing: border-box; padding: 52px 56px 50px; }
      .plate { position: absolute; inset: 0; background: var(--plate); border: 1px solid var(--edge); border-radius: 20px; }
      .content { position: relative; display: flex; flex-direction: column; }
      .mask { overflow: hidden; display: block; position: relative; }
      .eyebrow { display: block; color: var(--muted); font-weight: 800; font-size: 22px; letter-spacing: 0.16em; line-height: 1.3; text-transform: uppercase; }
      .num { display: block; color: var(--ink); font-weight: 800; font-size: 132px; letter-spacing: -0.03em; line-height: 1.0; padding: 10px 0 6px; white-space: nowrap; }
      /* tabular digits guaranteed: every digit gets the same slot width regardless of font features */
      .num .d { display: inline-block; width: 0.62em; text-align: center; }
      .num .c { display: inline-block; width: 0.26em; text-align: center; }
      .bar { position: relative; height: 10px; margin: 26px 0 26px; border-radius: 5px; background: var(--track); overflow: hidden; }
      .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--accent); border-radius: 5px; }
      .sub { display: block; color: var(--sub); font-weight: 500; font-size: 32px; letter-spacing: -0.005em; line-height: 1.25; }
      .sub b { color: var(--ink); font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="stat-card" data-start="0" data-duration="5" data-fps="30" data-width="1920" data-height="1080">
      <div class="zone">
        <div id="card" class="card">
          <div id="plate" class="plate"></div>
          <div class="content">
            <!-- CONTENT (locked copy, from the user's sentence only) -->
            <span class="mask" data-layout-allow-overflow data-layout-allow-occlusion><span id="eyebrow" class="eyebrow" data-layout-allow-occlusion>Subscribers</span></span>
            <span class="mask" data-layout-allow-overflow data-layout-allow-occlusion><span id="num" class="num" data-layout-allow-occlusion>1,200</span></span>
            <div id="bar" class="bar"><div id="fill" class="fill"></div></div>
            <span class="mask" data-layout-allow-overflow data-layout-allow-occlusion><span id="sub" class="sub" data-layout-allow-occlusion>from <b data-layout-allow-occlusion>1,200</b> in <b data-layout-allow-occlusion>9 months</b></span></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Locked numbers (from the user). Bar fill = value / END, so the bar is proportionally true at every frame.
      const START = 1200, END = 48000;
      const numEl = document.getElementById("num");
      const fmt = (v) => Math.round(v).toLocaleString("en-US")
        .replace(/\d/g, (d) => '<span class="d" data-layout-allow-occlusion>' + d + "</span>")
        .replace(/,/g, '<span class="c" data-layout-allow-occlusion>,</span>');
      // Property setter: GSAP writes `value` on every render, including seeks, so no callbacks are needed.
      let _v = START;
      const counter = {};
      Object.defineProperty(counter, "value", {
        get() { return _v; },
        set(v) { _v = v; const html = fmt(v); if (numEl.innerHTML !== html) numEl.innerHTML = html; },
      });
      counter.value = START;

      // Easing tokens: entrances decelerate (expo.out ~ cubic-bezier(0.16,1,0.3,1)); exits accelerate, ~25% faster.
      const ENTER = "expo.out", EXIT = "power3.in", COUNT = "power3.out";
      const T_COUNT = 0.95, D_COUNT = 1.5;   // count starts after a ~0.3 s stillness, lands at 2.45 s
      const T_EXIT = 4.3;

      const tl = gsap.timeline({ paused: true });
      // Beat 1 (0.00-0.75): plate rises in, then text rises through masks, 70 ms stagger
      tl.fromTo("#card", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: ENTER }, 0.0)
        .fromTo("#eyebrow", { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: ENTER }, 0.12)
        .fromTo("#num", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: ENTER }, 0.19)
        .fromTo("#bar", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: ENTER }, 0.26)
        .fromTo("#fill", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: START / END, duration: 0.35, ease: ENTER }, 0.3)
        .fromTo("#sub", { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: ENTER }, 0.33)
        // Beat 2 (0.95-2.45): the count. Number and bar share one ease and duration, so they stay in proportion.
        .fromTo(counter, { value: START }, { value: END, duration: D_COUNT, ease: COUNT }, T_COUNT)
        .fromTo("#fill", { scaleX: START / END }, { scaleX: 1, duration: D_COUNT, ease: COUNT, immediateRender: false }, T_COUNT)
        // Beat 3 (2.45-4.3): readable hold on the landed number (nothing moves: stillness after the climax)
        // Beat 4 (4.30-4.75): exit in reverse order, same axis it came from, faster
        .to("#sub", { yPercent: 110, duration: 0.3, ease: EXIT }, T_EXIT)
        .to("#num", { yPercent: 105, duration: 0.32, ease: EXIT }, T_EXIT + 0.05)
        .to("#eyebrow", { yPercent: 110, duration: 0.3, ease: EXIT }, T_EXIT + 0.1)
        .to("#bar", { opacity: 0, duration: 0.25, ease: EXIT }, T_EXIT + 0.08)
        .to("#card", { y: 24, opacity: 0, duration: 0.36, ease: EXIT }, T_EXIT + 0.16);
      window.__timelines["stat-card"] = tl;
    </script>
  </body>
</html>
